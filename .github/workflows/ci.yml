name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Static analysis (shellcheck + bashate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          python3 -m pip install --quiet bashate

      - name: shellcheck (strict)
        run: shellcheck -x harden.sh lib/*.sh tests/*.sh

      - name: bashate (style, advisory)
        run: python3 -m bashate -i E006,E010 harden.sh lib/*.sh tests/*.sh || true

  test:
    name: Container test — ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian, rocky]
    steps:
      - uses: actions/checkout@v4

      - name: Build test image (${{ matrix.distro }})
        run: docker build -f tests/Dockerfile.${{ matrix.distro }} -t hardening:${{ matrix.distro }} .

      - name: Run test suite (${{ matrix.distro }})
        run: docker run --rm hardening:${{ matrix.distro }}
