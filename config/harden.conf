#===============================================================================
# config/harden.conf — linux-hardening configuration
#
# Copy this file to /etc/linux-hardening/harden.conf (or pass --config FILE)
# and uncomment the keys you want to override.
# Load order (later wins):  defaults < this file < /etc/... < --config < CLI
#===============================================================================

#------------------------------------------------------------------------------
# Firewall
#------------------------------------------------------------------------------
# SSH port to protect (change it if your sshd listens on a non-standard port)
#SSH_PORT=22

# Extra TCP ports to keep open, comma or space separated
#ALLOW_PORTS="80,443"

# Keep IPv6 rules in ufw (true/false)
#FIREWALL_IPV6=true

#------------------------------------------------------------------------------
# SSH
#------------------------------------------------------------------------------
# Disable root login over SSH entirely (true -> PermitRootLogin no,
# false -> PermitRootLogin prohibit-password)
#DISABLE_ROOT_SSH=true

# Disable SSH password authentication:
#   true = force key-only login
#   false = keep password login
#   auto = key-only only if at least one user already has authorized_keys
#DISABLE_PASSWORD_AUTH=auto

#------------------------------------------------------------------------------
# Password policy
#------------------------------------------------------------------------------
#PASS_MAX_DAYS=90
#PASS_MIN_DAYS=7
#PASS_WARN_DAYS=7
#PASS_MIN_LEN=14

#------------------------------------------------------------------------------
# fail2ban
#------------------------------------------------------------------------------
#FAIL2BAN_MAXRETRY=5
#FAIL2BAN_FINDTIME=10m
#FAIL2BAN_BANTIME=1h

#------------------------------------------------------------------------------
# Automatic security updates
#------------------------------------------------------------------------------
#AUTO_UPDATES=true

#------------------------------------------------------------------------------
# Kernel
#------------------------------------------------------------------------------
# Set true ONLY on routers / docker hosts — enables net.ipv4.ip_forward=1.
# When false, the script disables forwarding unless docker is detected.
#IP_FORWARD=false
